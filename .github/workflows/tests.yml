name: tests

# Deterministic orchestrator suite (tests/) — no opencode server, no LLM calls,
# no GPU. Torch-dependent fixture tests skip automatically when torch is absent
# (pytest.importorskip), so the heavy ML deps stay out of CI. Runs as-is on
# forks: no internal endpoints or secrets are needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint the taxonomy SSOT
        run: python scripts/validate_taxonomy.py
      - name: Check pack readiness and generated-doc drift
        run: python scripts/validate_field_guides.py report
      - name: Run test suite
        run: python -m pytest -q
